<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>School • Reglife</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">

    <section class="stats-grid">
      <div class="stat-box"><span>Age</span><strong id="age">14</strong></div>
      <div class="stat-box"><span>Cash</span><strong id="cash">£50</strong></div>
      <div class="stat-box"><span>Health</span><strong id="health">60%</strong></div>
      <div class="stat-box"><span>Brains</span><strong id="brains">5</strong></div>
    </section>

    <h1 class="page-title">📚 School</h1>

    <section class="tasks">
      <button class="task" type="button" data-task="frenchQuiz">Learn French (Vocab Test)</button>
      <button class="task" type="button" data-task="mathsTest">Maths Test (30s)</button>
      <button class="task" type="button" data-task="puzzle">2-Minute Puzzle</button>
    </section>

    <!-- Maths Test -->
    <section class="quiz" id="mathSection" hidden>
      <h2>Maths Test</h2>

      <div class="quiz-card">
        <div class="quiz-top">
          <div id="mathProgress">Q1 / 5</div>
          <div id="mathTimer">⏱️ 30s</div>
          <div id="mathScore">Score: 0</div>
        </div>

        <div class="quiz-question" id="mathQuestion"></div>
        <div class="quiz-options" id="mathOptions"></div>
        <p class="quiz-status" id="mathStatus"></p>
      </div>
    </section>

    <a href="./index.html" class="back">← Back</a>

  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
